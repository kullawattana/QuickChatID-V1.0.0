# OCR Configuration for Thai ID Cards

# Primary OCR engine
primary_backend: typhoon-ocr  # typhoon-ocr, paddleocr, tesseract

# PaddleOCR Configuration
paddleocr:
  # Language
  lang: th  # Thai language
  
  # Model version
  version: PP-OCRv5  # Latest version
  
  # Use angle classification
  use_angle_cls: true
  
  # Use GPU
  use_gpu: false
  
  # Show logs
  show_log: false
  
  # Detection model
  det_model_dir: null  # null = use default
  
  # Recognition model
  rec_model_dir: null
  
  # Classification model  
  cls_model_dir: null

# EasyOCR Configuration
easyocr:
  # Languages
  languages: [th, en]
  
  # Use GPU
  gpu: false
  
  # Detection parameters
  paragraph: false
  text_threshold: 0.7
  low_text: 0.4
  link_threshold: 0.4

# Tesseract Configuration
tesseract:
  # Language data
  lang: tha+eng
  
  # Page segmentation mode
  psm: 3  # Automatic
  
  # OCR engine mode
  oem: 3  # Default (LSTM)

# Preprocessing
preprocessing:
  # Enable preprocessing
  enabled: true
  
  # Denoise
  denoise: true
  
  # Adaptive threshold
  adaptive_threshold: true
  
  # Deskew (rotate to correct angle)
  deskew: true
  
  # Enhance contrast
  enhance_contrast: true
  
  # Resize for optimal size
  auto_resize: true
  max_width: 1920
  max_height: 1080

# Field Extraction
extraction:
  # Validate ID number checksum
  validate_id: true
  
  # Extract all fields
  extract_all_fields: true
  
  # Required fields
  required_fields:
    - id_number
    - name_th
    - date_of_birth

# Validation
validation:
  # ID number length
  id_number_length: 13
  
  # Check ID expiry
  check_expiry: true
  
  # Minimum confidence threshold
  min_confidence: 0.6
  
  # Minimum text length
  min_text_length: 10

# Performance
performance:
  # Cache OCR models
  cache_models: true
  
  # Parallel processing
  parallel: false
  
  # Timeout (seconds)
  timeout: 30

# Output
output:
  # Save preprocessed images
  save_preprocessed: false
  
  # Save annotated images
  save_annotated: false
  
  # Output directory
  output_dir: output/ocr/
  
  # Include raw OCR data
  include_raw: false
