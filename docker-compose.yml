version: '3.8'

services:

  # ─── Application Services ─────────────────────────────────────────────────

  adk:
    build: .
    container_name: quickchatid-adk
    working_dir: /app/agents
    command: adk web --port 8000 --host 0.0.0.0
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./agents:/app/agents
      - ./uploads:/app/uploads
    networks:
      - quickchatid
    restart: unless-stopped

  webhook:
    build: .
    container_name: quickchatid-webhook
    command: python line_webhook_app.py
    env_file: .env
    environment:
      - ADK_SERVER_URL=http://adk:8000
    ports:
      - "5001:5001"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - adk
    networks:
      - quickchatid
    restart: unless-stopped

  web-api:
    build: .
    container_name: quickchatid-web-api
    command: python web_api_app.py
    env_file: .env
    environment:
      - ADK_SERVER_URL=http://adk:8000
      - PORT=5003
    ports:
      - "5003:5003"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - adk
    networks:
      - quickchatid
    restart: unless-stopped

  dashboard:
    build: .
    container_name: quickchatid-dashboard
    command: python dashboard_app.py
    env_file: .env
    ports:
      - "5002:5002"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - quickchatid
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: quickchatid-frontend
    ports:
      - "80:80"
    depends_on:
      - web-api
    networks:
      - quickchatid
    restart: unless-stopped

  # ─── Infrastructure Services ───────────────────────────────────────────────

  opa:
    image: openpolicyagent/opa:latest
    container_name: quickchatid-opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=info"
    volumes:
      - ./policies:/policies
    networks:
      - quickchatid
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: quickchatid-postgres
    environment:
      POSTGRES_DB: quickchatid
      POSTGRES_USER: quickchatid
      POSTGRES_PASSWORD: quickchatid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - quickchatid
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: quickchatid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quickchatid
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  quickchatid:
    driver: bridge
